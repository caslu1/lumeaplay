name: Publicar painel e site

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # player das TVs: hls.js (se falhar, o app usa o player nativo da TV)
      - name: Baixar hls.js
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP" && npm pack hls.js@1.5 --silent
          tar -xzf hls.js-*.tgz package/dist/hls.min.js
          cp package/dist/hls.min.js "$GITHUB_WORKSPACE/web/tv/js/hls.min.js"
          ls -la "$GITHUB_WORKSPACE/web/tv/js/hls.min.js"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: dep
        uses: actions/deploy-pages@v4
